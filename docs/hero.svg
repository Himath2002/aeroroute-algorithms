<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img">
  <title>AeroRoute Algorithms</title>
  <desc>A route-planning algorithm lab built around custom graph, queue, hash table, linked list, heap, and sorting implementations.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset="1" stop-color="#0C2940"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="1440" height="760" rx="32" fill="url(#background)"/>
  <circle cx="1290" cy="78" r="190" fill="#123B56" opacity=".45"/>
  <circle cx="138" cy="716" r="170" fill="#0C3946" opacity=".5"/>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="72" y="72" width="212" height="34" rx="17" fill="#123B56" stroke="#2DD4BF" stroke-opacity=".45"/>
    <circle cx="93" cy="89" r="5" fill="#2DD4BF"/>
    <text x="108" y="94" fill="#A7F3D0" font-size="13" font-weight="700" letter-spacing="1.2">JAVA ALGORITHM LAB</text>

    <text x="72" y="190" fill="#F8FAFC" font-size="62" font-weight="800">AeroRoute</text>
    <text x="72" y="250" fill="#67E8F9" font-size="48" font-weight="700">Algorithms</text>
    <text x="72" y="306" fill="#C9D9E5" font-size="20">Explore bounded routes, inspect custom structures,</text>
    <text x="72" y="338" fill="#C9D9E5" font-size="20">and compare three sorting strategies in one focused CLI.</text>

    <g transform="translate(72 386)">
      <rect width="180" height="48" rx="14" fill="#102F45" stroke="#28506A"/>
      <text x="90" y="30" text-anchor="middle" fill="#E2E8F0" font-size="14" font-weight="700">Bounded BFS</text>
    </g>
    <g transform="translate(266 386)">
      <rect width="202" height="48" rx="14" fill="#102F45" stroke="#28506A"/>
      <text x="101" y="30" text-anchor="middle" fill="#E2E8F0" font-size="14" font-weight="700">Custom structures</text>
    </g>
    <g transform="translate(482 386)">
      <rect width="186" height="48" rx="14" fill="#102F45" stroke="#28506A"/>
      <text x="93" y="30" text-anchor="middle" fill="#E2E8F0" font-size="14" font-weight="700">Java 17 + Gradle</text>
    </g>

    <g transform="translate(772 92)" filter="url(#shadow)">
      <rect width="596" height="430" rx="28" fill="#0B2235" stroke="#28506A"/>
      <text x="32" y="47" fill="#8DA9BC" font-size="13" font-weight="700" letter-spacing="1.1">ILLUSTRATIVE ROUTE NETWORK</text>
      <text x="32" y="76" fill="#E8F3F8" font-size="18" font-weight="700">Weighted edges become ranked candidate journeys</text>

      <g fill="none" stroke-linecap="round">
        <g stroke="#2DD4BF" stroke-width="4">
          <line x1="93" y1="172" x2="244" y2="121"/>
          <line x1="244" y1="121" x2="242" y2="252"/>
          <line x1="242" y1="252" x2="514" y2="248"/>
        </g>
        <g stroke="#315872" stroke-width="3">
          <line x1="242" y1="252" x2="416" y2="163"/>
          <line x1="416" y1="163" x2="514" y2="248"/>
          <line x1="416" y1="163" x2="435" y2="316"/>
          <line x1="435" y1="316" x2="514" y2="248"/>
        </g>
      </g>

      <g fill="#8DA9BC" font-size="11" font-weight="600">
        <text x="157" y="132">1,190 km</text>
        <text x="259" y="191">1,291 km</text>
        <text x="348" y="273">1,987 km</text>
        <text x="315" y="190">1,032 km</text>
        <text x="452" y="191">1,387 km</text>
        <text x="478" y="303">543 km</text>
      </g>

      <g>
        <circle cx="93" cy="172" r="38" fill="#2DD4BF"/>
        <text x="93" y="179" text-anchor="middle" fill="#062132" font-size="18" font-weight="800">JFK</text>

        <circle cx="244" cy="121" r="34" fill="#123B56" stroke="#67E8F9" stroke-width="2"/>
        <text x="244" y="127" text-anchor="middle" fill="#E8F3F8" font-size="16" font-weight="800">ORD</text>

        <circle cx="242" cy="252" r="34" fill="#123B56" stroke="#67E8F9" stroke-width="2"/>
        <text x="242" y="258" text-anchor="middle" fill="#E8F3F8" font-size="16" font-weight="800">DFW</text>

        <circle cx="416" cy="163" r="34" fill="#123B56" stroke="#67E8F9" stroke-width="2"/>
        <text x="416" y="169" text-anchor="middle" fill="#E8F3F8" font-size="16" font-weight="800">DEN</text>

        <circle cx="435" cy="316" r="34" fill="#123B56" stroke="#67E8F9" stroke-width="2"/>
        <text x="435" y="322" text-anchor="middle" fill="#E8F3F8" font-size="16" font-weight="800">SFO</text>

        <circle cx="514" cy="248" r="38" fill="#FBBF24"/>
        <text x="514" y="255" text-anchor="middle" fill="#2A1C02" font-size="18" font-weight="800">LAX</text>
      </g>

      <rect x="32" y="370" width="532" height="36" rx="18" fill="#102F45"/>
      <text x="298" y="393" text-anchor="middle" fill="#A7F3D0" font-size="13" font-weight="700">JFK → ORD → DFW → LAX  ·  4,468 km  ·  2 layovers</text>
    </g>

    <g transform="translate(72 574)">
      <rect width="1296" height="122" rx="24" fill="#0B2235" stroke="#28506A"/>
      <line x1="324" y1="26" x2="324" y2="96" stroke="#28506A"/>
      <line x1="648" y1="26" x2="648" y2="96" stroke="#28506A"/>
      <line x1="972" y1="26" x2="972" y2="96" stroke="#28506A"/>

      <text x="162" y="56" text-anchor="middle" fill="#67E8F9" font-size="25" font-weight="800">4</text>
      <text x="162" y="83" text-anchor="middle" fill="#C9D9E5" font-size="13">handwritten data structures</text>

      <text x="486" y="56" text-anchor="middle" fill="#67E8F9" font-size="25" font-weight="800">3</text>
      <text x="486" y="83" text-anchor="middle" fill="#C9D9E5" font-size="13">sorting implementations</text>

      <text x="810" y="56" text-anchor="middle" fill="#67E8F9" font-size="25" font-weight="800">3</text>
      <text x="810" y="83" text-anchor="middle" fill="#C9D9E5" font-size="13">sample route networks</text>

      <text x="1134" y="56" text-anchor="middle" fill="#67E8F9" font-size="25" font-weight="800">0</text>
      <text x="1134" y="83" text-anchor="middle" fill="#C9D9E5" font-size="13">external runtime services</text>
    </g>
  </g>
</svg>
